[package]
name = "xai-grok-runtime-bin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Serve-only Grok Build runtime without the TUI"

[lib]
name = "xai_grok_runtime"
path = "src/lib.rs"

[[bin]]
name = "grok-runtime"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uuid = { workspace = true, features = ["v4"] }
xai-grok-shell = { path = "../xai-grok-shell", default-features = false, features = ["serve-runtime"] }

[lints]
workspace = true
